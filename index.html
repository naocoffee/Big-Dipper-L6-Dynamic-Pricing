<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Budget</title>
  <!-- ?v= の数字は、ファイルを更新したら増やしてください（古いファイルが読み込まれるのを防ぎます） -->
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main class="wrap">

    <!-- 初期画面：ユーザー登録 -->
    <section id="screen-register">
      <h1>My Budget</h1>
      <p class="lead">ユーザー名と初期費用を入力してください。</p>

      <form id="form-register" novalidate>
        <div class="field">
          <label for="reg-name">ユーザー名</label>
          <input type="text" id="reg-name" maxlength="30" autocomplete="off">
        </div>
        <div class="field">
          <label for="reg-budget">初期費用（円・半角数字）</label>
          <input type="text" id="reg-budget" inputmode="numeric" value="10000" maxlength="9" autocomplete="off">
        </div>
        <button type="submit" class="btn">登録してはじめる</button>
        <p class="msg" id="reg-msg" role="alert"></p>
      </form>
    </section>

    <!-- メイン画面 -->
    <section id="screen-main" hidden>
      <div class="topbar">
        <span id="user-label"></span>
        <button type="button" class="link" id="btn-reset">登録をリセット</button>
      </div>

      <div class="balance-box">
        <p class="label">残金</p>
        <p class="balance" id="balance"></p>
        <p class="sub" id="spent"></p>
      </div>

      <form id="form-buy" novalidate>
        <fieldset class="field">
          <legend>購入カテゴリ</legend>
          <div class="seg">
            <label><input type="radio" name="category" value="チケット" checked><span>チケット</span></label>
            <label><input type="radio" name="category" value="応援グッズ"><span>応援グッズ</span></label>
            <label><input type="radio" name="category" value="食べ物"><span>食べ物</span></label>
            <label><input type="radio" name="category" value="その他"><span>その他</span></label>
          </div>
        </fieldset>

        <div class="field">
          <label for="amount">金額（円・半角数字）</label>
          <input type="text" id="amount" inputmode="numeric" placeholder="例: 3500" autocomplete="off">
        </div>

        <button type="submit" class="btn">購入を記録する</button>
        <p class="msg" id="buy-msg" role="status"></p>
      </form>

      <h2>購入履歴</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>時刻</th><th>項目</th><th class="num">金額</th><th class="num">残金</th></tr>
          </thead>
          <tbody id="history"></tbody>
        </table>
      </div>
      <p class="empty" id="history-empty">まだ購入はありません。</p>
      <p class="sync" id="sync-status"></p>
    </section>

  </main>
  <script src="script.js?v=4"></script>
</body>
</html>
